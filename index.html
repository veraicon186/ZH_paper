
<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henry – animace a papírové pozadí</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      --unit: 300px;

      margin: 0;
      min-height: 100vh;

      background-color: #fdfbfa;

      /* Papírové pozadí: rohy, kraje, dlaždice */
      background-image:
        url("./webp/paper_corner_top-left.webp"),
        url("./webp/paper_corner_top-right.webp"),
        url("./webp/paper_corner_bottom-left.webp"),
        url("./webp/paper_corner_bottom-right.webp"),

        url("./webp/paper_edge_top.webp"),
        url("./webp/paper_edge_bottom.webp"),
        url("./webp/paper_edge_left.webp"),
        url("./webp/paper_edge_right.webp"),

        url("./webp/paper_tile.webp");

      background-repeat:
        no-repeat,
        no-repeat,
        no-repeat,
        no-repeat,

        repeat-x,
        repeat-x,
        repeat-y,
        repeat-y,

        repeat;

      background-size:
        var(--unit) var(--unit),
        var(--unit) var(--unit),
        var(--unit) var(--unit),
        var(--unit) var(--unit),

        var(--unit) auto,
        var(--unit) auto,
        auto var(--unit),
        auto var(--unit),

        var(--unit) var(--unit);

      background-position:
        left top,
        right top,
        left bottom,
        right bottom,

        left top,
        left bottom,
        left top,
        right top,

        left top;
    }

    /* Celý obsah stránky */
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Rive animace */
    #rive-container {
      position: relative;
      width: auto;
      height: 95vh;
      max-height: 950px;
      max-width: 100%;
      aspect-ratio: 9 / 16;
      flex-shrink: 0;
    }

    #rive-container canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Hlavní animace */
    #rive-main {
      z-index: 1;
    }

    /* Text pod animací */
    .text-content {
      width: 100%;
      max-width: 700px;
      padding: 0 16px 60px;
      line-height: 1.6;
    }

    .text-content h1 {
      margin-top: 0;
    }

    @media (max-width: 600px) {
      main {
        padding: 20px 12px;
        gap: 24px;
      }

      #rive-container {
        width: min(100%, 53.4375vh);
        height: auto;
        max-height: none;
        aspect-ratio: 9 / 16;
      }

      .text-content {
        padding: 0 16px 40px;
      }
    }
  </style>
</head>

<body>
  <main>

    <!-- Animace Henryho -->
    <div id="rive-container">
      <canvas id="rive-main"></canvas>
    </div>

    <!-- Text -->
    <section class="text-content">
      <h1>Papírové pozadí a animace</h1>
      <p>
        Toto je test propojení škálovatelného papírového
        pozadí s animací Rive. Pozadí se přizpůsobuje
        velikosti stránky, zatímco animace zůstává
        vycentrovaná a zachovává svůj poměr stran.
      </p>
    </section>

  </main>

  <!-- Rive -->
  <script src="https://unpkg.com/@rive-app/canvas@2"></script>

  <script>
    // Hlavní animace Henryho
    const main = new rive.Rive({
      src: "./henry_6_7.riv",
      canvas: document.getElementById("rive-main"),
      autoplay: true,
      onLoad: () => main.resizeDrawingSurfaceToCanvas()
    });

    // Přizpůsobení při změně velikosti okna
    window.addEventListener("resize", () => {
      main.resizeDrawingSurfaceToCanvas();
    });
  </script>
</body>
</html>
