
<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test animace Rive</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background-image: url("./paper_tile.svg");
        background-repeat: repeat;
        background-size: 400px 400px;
      }

      #rive-container {
        position: relative;
        height: 95vh;
        aspect-ratio: 9 / 16;
        max-width: 100vw;
      }

      #rive-container canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Hlavní animace */
      #rive-main {
        
        z-index: 1;
      }

      /* Odlesky nad hlavní animací */
      #rive-shine {
        z-index: 2;
        pointer-events: none;
      }

    
      
    </style>
  </head>

  <body>

    
    <div id="rive-container">
      <canvas id="rive-main"></canvas>
      <canvas id="rive-shine"></canvas>
    </div>

    <script src="https://unpkg.com/@rive-app/canvas@2"></script>

    <script>
      // Hlavní animace Henryho
      const main = new rive.Rive({
        src: "./henry_6_7.riv",
        canvas: document.getElementById("rive-main"),
        autoplay: true,
        onLoad: () => main.resizeDrawingSurfaceToCanvas(),
      });

      // Samostatná animace odlesků
      const shine = new rive.Rive({
        src: "./shine.riv",
        canvas: document.getElementById("rive-shine"),
        autoplay: true,
        onLoad: () => shine.resizeDrawingSurfaceToCanvas(),
      });

      // Přizpůsobení při změně velikosti okna
      window.addEventListener("resize", () => {
        main.resizeDrawingSurfaceToCanvas();
        shine.resizeDrawingSurfaceToCanvas();
      });
    </script>
  </body>
</html>
